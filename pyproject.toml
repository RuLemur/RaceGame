[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["car_racer", "helpers"]

[project]
name = "race-game"
version = "0.1.0"
description = "Игра-симулятор гонок, в которой машинка учится ездить сама через NEAT (нейроэволюция)"
requires-python = ">=3.11"
dependencies = [
    "pygame==2.6.1",
    "pymunk==7.3.0",
    "numpy==2.2.6",
    "neat-python==2.0.0",
    # только для car_racer/tracks/svg_track_importer.py, см. requirements.txt
    "svgpathtools==1.8.0",
    # только для car_racer/tracks/build_real_circuits.py, см. requirements.txt
    "Pillow==11.1.0",
    "scikit-image==0.25.2",
    "scipy==1.15.3",
]
