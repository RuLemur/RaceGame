<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RaceGame — панель обучения NEAT</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>RaceGame</h1>
      <span class="sub">панель управления</span>
    </div>
    <div class="status" id="status">
      <span class="dot"></span>
      <span id="status-text">подключение…</span>
    </div>
    <div class="gen-badge">
      поколение <b id="kpi-generation">—</b>
    </div>
  </header>

  <section class="kpis" id="kpis">
    <div class="kpi"><span class="k">Фитнес (макс)</span><span class="v" id="kpi-fitness">—</span></div>
    <div class="kpi"><span class="k">Лучший круг</span><span class="v" id="kpi-lap">—</span></div>
    <div class="kpi"><span class="k">Дистанция</span><span class="v" id="kpi-distance">—</span></div>
    <div class="kpi"><span class="k">Чекпоинты</span><span class="v" id="kpi-cl">—</span></div>
    <div class="kpi"><span class="k">Кругов</span><span class="v" id="kpi-laps">—</span></div>
    <div class="kpi"><span class="k">FPS</span><span class="v" id="kpi-fps">—</span></div>
    <div class="kpi"><span class="k">Осталось в группе</span><span class="v" id="kpi-left">—</span></div>
  </section>

  <section class="controls">
    <div class="controls-group">
      <button id="btn-pause" class="btn">Пауза</button>
      <button id="btn-fps" class="btn">Unlimited FPS</button>
      <button id="btn-restart-group" class="btn warn">Restart Group</button>
      <button id="btn-restart-training" class="btn danger">Restart Training</button>
      <button id="btn-recompute" class="btn">Recompute Ideal Line</button>
    </div>

    <div class="controls-group">
      <label>Трасса
        <select id="field-track"></select>
      </label>
      <button id="btn-follow" class="btn">Camera Follow</button>
      <label>Zoom
        <input id="field-zoom" type="range" min="0.02" max="2.5" step="0.01" />
      </label>
      <button id="btn-tracklines" class="btn">Track Lines</button>
    </div>

    <div class="controls-group fields">
      <label>Размер группы <input id="field-group" type="number" min="1" /></label>
      <label>Видимых <input id="field-visible" type="number" min="1" /></label>
      <label>Pop size <input id="field-pop" type="number" min="1" /></label>
      <label>Render FPS <input id="field-fps" type="number" min="1" /></label>
      <label>Сцепление (g) <input id="field-grip" type="number" step="0.1" min="0.5" max="3.0" /></label>
      <label>Вес (кг) <input id="field-mass" type="number" min="50" max="300" /></label>
      <label>Мощность (л.с.) <input id="field-power" type="number" min="1" max="1000" /></label>
    </div>
  </section>

  <section class="charts">
    <div class="card wide"><canvas id="chart-fitness"></canvas></div>
    <div class="card"><canvas id="chart-species"></canvas></div>
    <div class="card"><canvas id="chart-progress"></canvas></div>
  </section>

  <section class="charts">
    <div class="card wide genome-card">
      <h3 class="card-title">Геном лидера</h3>
      <canvas id="genome-canvas" width="1000" height="340"></canvas>
    </div>
  </section>

  <footer class="foot">
    <span id="meta-track">трасса: —</span>
    <span id="meta-paused" class="muted"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
